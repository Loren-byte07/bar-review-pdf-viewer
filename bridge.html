<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bar Review PDF Study Reader</title>
  <style>
    html, body, #inko {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: #111;
    }
    body {
      font-family: Arial, sans-serif;
    }
    #status {
      position: fixed;
      z-index: 9999;
      right: 10px;
      bottom: 10px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 11px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="inko"></div>
  <div id="status"></div>

  <script src="./sdk/inko-sdk.js"></script>
  <script>
    (function () {
      "use strict";

      var PARENT_ORIGINS = new Set([
        "https://script.google.com",
        "https://script.googleusercontent.com"
      ]);

      var viewer = null;
      var viewerReady = false;
      var pendingDocument = null;
      var statusTimer = null;

      function showStatus(message) {
        var el = document.getElementById("status");
        el.textContent = message || "";
        el.classList.toggle("show", !!message);
        clearTimeout(statusTimer);
        if (message) {
          statusTimer = setTimeout(function () {
            el.classList.remove("show");
          }, 1800);
        }
      }

      function sendToParent(message) {
        // The bridge is embedded only by the Bar Review app.
        window.parent.postMessage(message, "*");
      }

      function loadPendingDocument() {
        if (!viewerReady || !viewer || !pendingDocument) return;

        var payload = pendingDocument;
        pendingDocument = null;

        showStatus("Opening PDF…");

        try {
          viewer.loadPdfBase64(
            payload.base64,
            payload.fileName || "case.pdf",
            payload.canvasData || undefined,
            false
          );
        } catch (error) {
          console.error(error);
          sendToParent({
            type: "INKO_BRIDGE_ERROR",
            message: error && error.message ? error.message : String(error)
          });
        }
      }

      function startViewer() {
        if (!window.Inko || typeof Inko.mount !== "function") {
          sendToParent({
            type: "INKO_BRIDGE_ERROR",
            message: "Inko SDK did not load."
          });
          return;
        }

        viewer = Inko.mount("#inko", {
          src: "./viewer/index.html",
          readOnly: false,
          locale: "en",

          onReady: function () {
            viewerReady = true;
            sendToParent({ type: "INKO_BRIDGE_READY" });
            loadPendingDocument();
          },

          onPdfLoaded: function () {
            showStatus("");
            sendToParent({ type: "INKO_PDF_LOADED" });
          },

          onChange: function (canvasData) {
            sendToParent({
              type: "INKO_CANVAS_CHANGED",
              canvasData: String(canvasData || "")
            });
          },

          onSave: function (canvasData, ok, message) {
            sendToParent({
              type: "INKO_SAVE_RESULT",
              ok: !!ok,
              message: message || "",
              canvasData: String(canvasData || "")
            });
          },

          onError: function (error) {
            sendToParent({
              type: "INKO_BRIDGE_ERROR",
              message: error && error.message ? error.message : String(error)
            });
          }
        });
      }

      window.addEventListener("message", function (event) {
        if (!PARENT_ORIGINS.has(event.origin)) return;

        var data = event.data || {};

        if (data.type === "BAR_REVIEW_LOAD_PDF") {
          pendingDocument = {
            base64: String(data.base64 || ""),
            fileName: String(data.fileName || "case.pdf"),
            canvasData: String(data.canvasData || "")
          };

          loadPendingDocument();
          return;
        }

        if (data.type === "BAR_REVIEW_SAVE_NOW") {
          if (viewer && typeof viewer.save === "function") {
            try { viewer.save(); } catch (error) { console.error(error); }
          }
          return;
        }

        if (data.type === "BAR_REVIEW_CLEAR") {
          if (viewer && typeof viewer.clear === "function") {
            try { viewer.clear(); } catch (error) { console.error(error); }
          }
        }
      });

      startViewer();
    })();
  </script>
</body>
</html>
